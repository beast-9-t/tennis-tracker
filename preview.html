<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网球记录助手 - 网站预览</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-pulse-slow { animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-bounce-slow { animation: bounce-slow 2s ease-in-out infinite; }
        .gradient-text {
            background: linear-gradient(135deg, #56ab2f, #1976d2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }
        .card:hover {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-50/30 via-white to-blue-50/30">
    <!-- 主内容区域 -->
    <main class="container mx-auto px-4 py-6 max-w-2xl pb-24">
        <!-- 欢迎区域 -->
        <div class="relative overflow-hidden bg-gradient-to-br from-green-200/20 via-white to-blue-200/20 p-6 rounded-3xl mb-6">
            <div class="absolute top-4 right-4 text-8xl opacity-10 animate-pulse-slow">🎾</div>
            
            <div class="relative z-10">
                <h1 class="text-3xl font-bold gradient-text mb-2">网球记录助手</h1>
                <p class="text-gray-600 mb-4">记录每一次挥拍，见证每一个进步</p>
                
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-white/80 backdrop-blur-sm rounded-xl p-3 text-center shadow-sm">
                        <div class="text-2xl font-bold text-green-600">3</div>
                        <p class="text-xs text-gray-500">总场次</p>
                    </div>
                    <div class="bg-white/80 backdrop-blur-sm rounded-xl p-3 text-center shadow-sm">
                        <div class="text-2xl font-bold text-blue-600">4.5h</div>
                        <p class="text-xs text-gray-500">总时长</p>
                    </div>
                    <div class="bg-white/80 backdrop-blur-sm rounded-xl p-3 text-center shadow-sm">
                        <div class="text-2xl font-bold text-green-600">2</div>
                        <p class="text-xs text-gray-500">本周场次</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 最近记录 -->
        <div class="card p-4 mb-4">
            <div class="flex items-center space-x-2 mb-3">
                <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <span class="font-semibold text-gray-900">最近一场</span>
            </div>
            <div class="flex items-start space-x-3">
                <div class="text-4xl">😊</div>
                <div class="flex-1">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="font-semibold text-gray-900">昨天</p>
                            <p class="text-sm text-gray-500">综合训练</p>
                        </div>
                        <div class="text-right">
                            <p class="text-sm text-gray-600">能量: 6/10</p>
                        </div>
                    </div>
                    <div class="flex space-x-2 mt-2">
                        <span class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded-full">90分钟</span>
                        <span class="px-2 py-1 bg-blue-100 text-blue-700 text-xs rounded-full">评分: 8/10</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 本周目标 -->
        <div class="card p-4 mb-4">
            <div class="flex items-center space-x-2 mb-3">
                <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
                <span class="font-semibold text-gray-900">本周目标</span>
            </div>
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-gray-600">训练场次</span>
                    <div class="flex items-center space-x-2">
                        <span class="font-semibold text-green-600">2/4</span>
                    </div>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                    <div class="bg-gradient-to-r from-green-500 to-blue-500 h-full rounded-full" style="width: 50%"></div>
                </div>
                <p class="text-sm text-gray-500 text-center">继续加油！距离本周目标还差 2 场</p>
            </div>
        </div>

        <!-- 最近记录 -->
        <div>
            <h3 class="font-semibold text-gray-900 mb-3 flex items-center space-x-2">
                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.879 16.121A3 3 0 1012.015 11L11 14H9c0 .768.293 1.536.879 2.121z"></path>
                </svg>
                <span>最近记录</span>
            </h3>
            <div class="space-y-3">
                <div class="card p-4">
                    <div class="flex items-start space-x-3">
                        <div class="text-3xl">😊</div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <p class="font-semibold text-gray-900">昨天</p>
                                <span class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded-full">综合训练</span>
                            </div>
                            <div class="flex space-x-2 mt-2 text-sm text-gray-600">
                                <span>90分钟</span>
                                <span>•</span>
                                <span>评分: 8/10</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card p-4">
                    <div class="flex items-start space-x-3">
                        <div class="text-3xl">😊</div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <p class="font-semibold text-gray-900">3天前</p>
                                <span class="px-2 py-1 bg-blue-100 text-blue-700 text-xs rounded-full">正手</span>
                            </div>
                            <div class="flex space-x-2 mt-2 text-sm text-gray-600">
                                <span>120分钟</span>
                                <span>•</span>
                                <span>评分: 9/10</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card p-4">
                    <div class="flex items-start space-x-3">
                        <div class="text-3xl">🎉</div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <p class="font-semibold text-gray-900">5天前</p>
                                <span class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded-full">发球</span>
                            </div>
                            <div class="flex space-x-2 mt-2 text-sm text-gray-600">
                                <span>60分钟</span>
                                <span>•</span>
                                <span>评分: 7/10</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 悬浮按钮 -->
    <div class="fixed bottom-24 right-4 z-40">
        <div class="w-16 h-16 bg-gradient-to-br from-green-500 to-blue-600 text-white rounded-full shadow-lg flex items-center justify-center cursor-pointer hover:scale-110 transition-transform duration-300">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
        </div>
    </div>

    <!-- 导航栏 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md shadow-lg border-t border-gray-200 z-50">
        <div class="flex justify-around items-center py-2">
            <button class="flex flex-col items-center px-4 py-2 rounded-lg text-green-600 bg-green-50">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                <span class="text-xs mt-1 font-medium">首页</span>
            </button>
            <button class="flex flex-col items-center px-4 py-2 rounded-lg text-gray-500 hover:text-green-600 hover:bg-green-5">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <span class="text-xs mt-1">历史记录</span>
            </button>
            <button class="flex flex-col items-center px-4 py-2 rounded-lg text-gray-500 hover:text-green-600 hover:bg-green-5">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
                <span class="text-xs mt-1">统计分析</span>
            </button>
        </div>
    </nav>

    <!-- 预览提示 -->
    <div class="fixed top-4 left-4 right-4 z-50">
        <div class="bg-yellow-100 border-l-4 border-yellow-500 p-4 rounded-lg shadow-lg">
            <div class="flex items-center">
                <span class="text-2xl mr-3">💡</span>
                <div>
                    <p class="font-bold text-yellow-800">这是一个预览版本</p>
                    <p class="text-sm text-yellow-700">实际功能需要启动开发服务器才能使用。请点击"打开网站.html"查看启动指南。</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
